<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Different Microorganisms | Plant Science Academy</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(120deg, #e7f0d0, #f5f5e9, #e3edce);
    color: #171717;
    min-height: 100vh;
}

.navbar {
    height: 72px;
    padding: 0 8%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(80,100,50,0.12);
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 17px;
    font-weight: 800;
}

.logo-icon {
    width: 38px;
    height: 38px;
    background: #172a19;
    color: white;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 21px;
}

.home {
    text-decoration: none;
    color: #171717;
    font-weight: 600;
    font-size: 14px;
}

.container {
    max-width: 1080px;
    margin: auto;
    padding: 45px 20px 55px;
}

.heading {
    text-align: center;
    margin-bottom: 40px;
}

.heading h1 {
    font-size: 36px;
    font-weight: 800;
    margin-bottom: 12px;
}

.heading p {
    font-size: 14px;
    color: #444;
    line-height: 1.6;
}

.notes {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.note-card {
    position: relative;
    overflow: hidden;
    padding: 25px;
    min-height: 195px;
    border-radius: 25px;
    background: rgba(255,255,255,0.78);
    border: 1px solid rgba(255,255,255,0.65);
    transition: 0.3s;
}

.note-card::before {
    content: "";
    position: absolute;
    top: -38px;
    right: -38px;
    width: 105px;
    height: 105px;
    border-radius: 50%;
    background: rgba(169,199,124,0.35);
}

.note-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 25px rgba(65,90,45,0.12);
}

.icon {
    width: 42px;
    height: 42px;
    border-radius: 13px;
    background: rgba(181,205,148,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    margin-bottom: 17px;
}

.note-card h2 {
    font-size: 16px;
    margin-bottom: 12px;
    position: relative;
}

.note-card p {
    font-size: 13px;
    color: #555;
    line-height: 1.6;
    margin-bottom: 17px;
}

.note-card a {
    color: #243b2b;
    text-decoration: none;
    font-weight: 700;
    font-size: 13px;
    margin-right: 12px;
}

.note-card a:hover {
    color: #679342;
}

.message {
    text-align: center;
    padding: 30px;
    color: #555;
    grid-column: 1 / -1;
}

footer {
    text-align: center;
    padding: 25px;
    font-size: 12px;
    color: #666;
}

@media(max-width:900px) {
    .notes {
        grid-template-columns: repeat(2,1fr);
    }
}

@media(max-width:600px) {
    .navbar {
        padding: 0 5%;
        height: 65px;
    }

    .logo {
        font-size: 14px;
    }

    .heading h1 {
        font-size: 27px;
    }

    .heading p {
        font-size: 12px;
    }

    .notes {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<nav class="navbar">

    <div class="logo">
        <div class="logo-icon">🌿</div>
        Plant Science Academy
    </div>

    <a href="microbiology.html" class="home">
        ← Microbiology
    </a>

</nav>

<main class="container">

    <div class="heading">
        <h1>🦠 Different Microorganisms</h1>

        <p>
            Study of Bacteria, Fungi, Viruses, Algae,
            Protozoa and their Classification,
            Structure and Characteristics.
        </p>
    </div>

    <div class="notes" id="microbiologyNotes">

        <div class="message">Loading study materials...</div>

    </div>

</main>

<footer>
    © 2026 Plant Science Academy | Learn • Grow • Succeed
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseClient = window.supabase.createClient(
    "https://cqucrvpugvcrjcwrwtyh.supabase.co",
    "sb_publishable_ZfGeOkLQOOs8XcRNsHx_dA_nlBtffSK"
);

async function loadMicrobiologyNotes() {

    const container = document.getElementById("microbiologyNotes");

    const { data, error } = await supabaseClient
        .from("study_notes")
        .select("title, subject, file_url")
        .eq("subject", "Microbiology")
        .ilike("title", "%Different%")
        .order("created_at", { ascending: false });

    if (error) {
        console.error(error);
        container.innerHTML =
            '<div class="message">Unable to load study materials.</div>';
        return;
    }

    container.innerHTML = "";

    if (!data || data.length === 0) {
        container.innerHTML =
            '<div class="message">No study materials available yet.</div>';
        return;
    }

    data.forEach(note => {

        const card = document.createElement("div");
        card.className = "note-card";

        const icon = document.createElement("div");
        icon.className = "icon";
        icon.textContent = "📄";

        const title = document.createElement("h2");
        title.textContent = note.title;

        const subject = document.createElement("p");
        subject.textContent = "Microbiology Study Material";

        const view = document.createElement("a");
        view.href = note.file_url;
        view.target = "_blank";
        view.rel = "noopener noreferrer";
        view.textContent = "View PDF →";

        const download = document.createElement("a");
        download.href = note.file_url;
        download.target = "_blank";
        download.rel = "noopener noreferrer";
        download.textContent = "Download ↓";

        card.append(icon, title, subject, view, download);

        container.appendChild(card);

    });
}

window.addEventListener("DOMContentLoaded", loadMicrobiologyNotes);

</script>

</body>
</html>
