<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MCQ Practice | Plant Science Academy</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
    --green: #174d32;
    --green-light: #e3edcf;
    --bg: #e9efd9;
    --white: #ffffff;
    --text: #17251b;
    --muted: #667166;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #e9efd9, #f4f5e9);
    color: var(--text);
    min-height: 100vh;
}

/* HEADER */

header {
    width: 100%;
    padding: 15px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(220, 233, 194, 0.85);
    border-bottom: 1px solid rgba(40, 80, 40, 0.12);
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 19px;
    font-weight: 800;
}

.logo-icon {
    width: 38px;
    height: 38px;
    background: #102e27;
    color: #b5d78d;
    border-radius: 11px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 21px;
}

.home-link {
    text-decoration: none;
    color: #17251b;
    font-weight: 700;
}

/* MAIN */

.container {
    width: 90%;
    max-width: 1000px;
    margin: 55px auto;
}

.heading {
    text-align: center;
    margin-bottom: 35px;
}

.heading h1 {
    font-size: 34px;
    font-weight: 800;
    margin-bottom: 10px;
}

.heading p {
    color: var(--muted);
    font-size: 15px;
}

/* CARDS */

.card {
    background: rgba(255, 255, 255, 0.82);
    border-radius: 25px;
    padding: 30px;
    box-shadow: 0 8px 25px rgba(30, 60, 30, 0.06);
    border: 1px solid rgba(255,255,255,0.7);
    margin-bottom: 25px;
    position: relative;
    overflow: hidden;
}

.card::after {
    content: "";
    position: absolute;
    width: 100px;
    height: 100px;
    background: rgba(174, 203, 132, 0.25);
    border-radius: 0 0 0 100%;
    top: 0;
    right: 0;
    pointer-events: none;
}

.card h2 {
    font-size: 20px;
    margin-bottom: 18px;
    position: relative;
    z-index: 1;
}

label {
    display: block;
    font-weight: 700;
    margin-bottom: 12px;
}

select {
    width: 100%;
    padding: 15px;
    border: 1px solid #d4ddce;
    border-radius: 12px;
    background: #fff;
    font-size: 15px;
    outline: none;
    margin-bottom: 20px;
}

/* BUTTONS */

button {
    border: none;
    background: var(--green);
    color: white;
    padding: 13px 25px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: #286441;
    transform: translateY(-2px);
}

button:disabled {
    background: #a7b5a9;
    cursor: not-allowed;
    transform: none;
}

.hidden {
    display: none !important;
}

/* QUIZ */

.quiz-info {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    color: var(--muted);
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 20px;
}

.progress-bg {
    width: 100%;
    height: 9px;
    background: #e1e8dc;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 25px;
}

.progress {
    width: 0%;
    height: 100%;
    background: #39764a;
    transition: 0.3s;
}

.question {
    font-size: 20px;
    font-weight: 700;
    line-height: 1.6;
    margin-bottom: 22px;
}

.option {
    display: block;
    width: 100%;
    text-align: left;
    padding: 15px;
    margin-bottom: 12px;
    border: 1px solid #dce4d6;
    background: #fff;
    color: #26352a;
    border-radius: 12px;
    font-size: 15px;
    line-height: 1.5;
}

.option:hover {
    background: #eef5e8;
    transform: none;
}

.option.selected {
    border: 2px solid #39764a;
    background: #e6f0df;
}

.option.correct {
    background: #d8f3df;
    border: 2px solid #24944c;
}

.option.wrong {
    background: #ffe1df;
    border: 2px solid #d64b4b;
}

.feedback {
    margin-top: 18px;
    padding: 15px;
    border-radius: 12px;
    line-height: 1.5;
    background: #edf3e8;
    display: none;
}

.quiz-buttons {
    display: flex;
    justify-content: space-between;
    margin-top: 25px;
    gap: 10px;
}

/* RESULT */

.result {
    text-align: center;
    padding: 25px 10px;
}

.result h2 {
    font-size: 29px;
    margin-bottom: 15px;
}

.score {
    font-size: 45px;
    color: var(--green);
    font-weight: 800;
    margin: 20px 0;
}

.result p {
    color: var(--muted);
    margin-bottom: 22px;
}

.message {
    color: #b33c32;
    margin-bottom: 15px;
    font-weight: 700;
}

/* FOOTER */

footer {
    text-align: center;
    padding: 25px;
    color: #697469;
    font-size: 13px;
}

/* MOBILE */

@media(max-width:600px) {

    header {
        padding: 14px 5%;
    }

    .logo {
        font-size: 15px;
    }

    .container {
        width: 92%;
        margin: 40px auto;
    }

    .heading h1 {
        font-size: 27px;
    }

    .card {
        padding: 22px 18px;
    }

    .question {
        font-size: 17px;
    }

    .quiz-buttons button {
        padding: 12px 16px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        <div class="logo-icon">🌿</div>
        Plant Science Academy
    </div>

    <a href="index.html" class="home-link">← Home</a>

</header>


<main class="container">

    <div class="heading">
        <h1>📝 MCQ Practice</h1>
        <p>Practice questions and improve your preparation.</p>
    </div>


    <!-- SUBJECT SELECTION -->

    <section class="card" id="subjectSection">

        <h2>Select Your Subject</h2>

        <label for="subject">Choose Subject</label>

        <select id="subject">
            <option value="Genetics">Genetics</option>
            <option value="Plant Breeding">Plant Breeding</option>
            <option value="Plant Pathology">Plant Pathology</option>
            <option value="Seed Science">Seed Science</option>
            <option value="Microbiology">Microbiology</option>
            <option value="Agriculture">Agriculture</option>
        </select>

        <button onclick="startPractice()">
            Start Practice →
        </button>

    </section>


    <!-- QUIZ SECTION -->

    <section class="card hidden" id="quizSection">

        <div class="quiz-info">

            <span id="subjectName">Genetics</span>

            <span id="questionCount">Question 1</span>

        </div>

        <div class="progress-bg">
            <div class="progress" id="progress"></div>
        </div>

        <div class="question" id="question">
            Loading question...
        </div>

        <div id="options"></div>

        <div class="feedback" id="feedback"></div>

        <div class="quiz-buttons">

            <button onclick="goHome()" style="background:#68776a">
                Exit
            </button>

            <button id="nextBtn" onclick="nextQuestion()" disabled>
                Next →
            </button>

        </div>

    </section>


    <!-- RESULT SECTION -->

    <section class="card hidden" id="resultSection">

        <div class="result">

            <h2>🎉 Test Completed!</h2>

            <p>Your Practice Result</p>

            <div class="score" id="finalScore">0/0</div>

            <p id="resultMessage"></p>

            <button onclick="restartPractice()">
                Practice Again →
            </button>

        </div>

    </section>

</main>


<footer>
   © 2026 Plant Science Academy | Learn • Practice • Master
</footer>


<script>

// ==================================
// SUPABASE CONFIGURATION
// ==================================

// sb_publishable_ZfGeOkLQOOs8XcRNsHx_dA_nlBtffSK

const SUPABASE_URL = "https://cqucrvpugvcrjcwrwtyh.supabase.co";
const SUPABASE_KEY = "sb_publishable_ZfGeOkLQOOs8XcRNsHx_dA_nlBtffSK";

let supabaseClient = null;

if (
    SUPABASE_URL !== "YOUR_SUPABASE_PROJECT_URL"&&
    SUPABASE_KEY !== "YOUR_SUPABASE_PUBLISHABLE_KEY"
) {
    supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );
}


// ==================================
// QUIZ VARIABLES
// ==================================

let questions = [];
let currentQuestion = 0;
let score = 0;
let answered = false;


// ==================================
// START PRACTICE
// ==================================

async function startPractice() {

    const subject = document.getElementById("subject").value;

    if (!supabaseClient) {
        alert("Supabase अभी Connect नहीं हुआ है। पहले Project URL और Publishable Key सेट करें।");
        return;
    }

    const startButton = document.querySelector(
        "#subjectSection button"
    );

    startButton.disabled = true;
    startButton.textContent = "Loading Questions...";

    try {

        const { data, error } = await supabaseClient
            .from("mcqs")
            .select("*")
            .eq("subject", subject)
            .eq("is_published", true)
            .order("created_at", { ascending: true });

        if (error) throw error;

        if (!data || data.length === 0) {
            alert("इस Subject में अभी कोई Published MCQ उपलब्ध नहीं है।");
            return;
        }

        questions = data;
        currentQuestion = 0;
        score = 0;

        document.getElementById("subjectSection")
            .classList.add("hidden");

        document.getElementById("resultSection")
            .classList.add("hidden");

        document.getElementById("quizSection")
            .classList.remove("hidden");

        document.getElementById("subjectName").textContent = subject;

        showQuestion();

    } catch (error) {

        console.error(error);

        alert("Questions Load नहीं हुए। Supabase Database और Table Settings चेक करें।");

    } finally {

        startButton.disabled = false;
        startButton.textContent = "Start Practice →";

    }

}


// ==================================
// SHOW QUESTION
// ==================================

function showQuestion() {

    answered = false;

    const q = questions[currentQuestion];

    document.getElementById("question").textContent =
        q.question;

    document.getElementById("questionCount").textContent =
        `Question ${currentQuestion + 1} / ${questions.length}`;

    document.getElementById("progress").style.width =
        ((currentQuestion + 1) / questions.length * 100) + "%";

    document.getElementById("feedback").style.display = "none";

    document.getElementById("nextBtn").disabled = true;

    const optionsBox = document.getElementById("options");

    optionsBox.innerHTML = "";

    const options = [
        ["A", q.option_a],
        ["B", q.option_b],
        ["C", q.option_c],
        ["D", q.option_d]
    ];

    options.forEach(([key, value]) => {

        const button = document.createElement("button");

        button.className = "option";

        button.textContent = key + ". " + value;

        button.onclick = () => checkAnswer(key, button);

        optionsBox.appendChild(button);

    });

}


// ==================================
// CHECK ANSWER
// ==================================

function checkAnswer(selected, selectedButton) {

    if (answered) return;

    answered = true;

    const q = questions[currentQuestion];

    const correct = String(q.correct_answer).toUpperCase();

    const allOptions = document.querySelectorAll(".option");

    allOptions.forEach(button => {

        button.disabled = true;

        const key = button.textContent.substring(0, 1);

        if (key === correct) {
            button.classList.add("correct");
        }

    });

    const feedback = document.getElementById("feedback");

    feedback.style.display = "block";

    if (selected === correct) {

        score++;

        feedback.innerHTML =
            "<strong>✓ Correct Answer!</strong>";

        feedback.style.background = "#d8f3df";

    } else {

        selectedButton.classList.add("wrong");

        feedback.innerHTML =
            "<strong>✗ Incorrect Answer</strong><br>Correct Answer: " +
            correct + ". " + q["option_" + correct.toLowerCase()];

        feedback.style.background = "#ffe1df";

    }

    if (q.explanation) {

        feedback.innerHTML +=
            "<br><br><strong>Explanation:</strong> " + escapeHTML(q.explanation);

    }

    document.getElementById("nextBtn").disabled = false;

}


// ==================================
// NEXT QUESTION
// ==================================

function nextQuestion() {

    currentQuestion++;

    if (currentQuestion < questions.length) {

        showQuestion();

    } else {

        showResult();

    }

}


// ==================================
// SHOW RESULT
// ==================================

function showResult() {

    document.getElementById("quizSection")
        .classList.add("hidden");

    document.getElementById("resultSection")
        .classList.remove("hidden");

    document.getElementById("finalScore").textContent =
        score + " / " + questions.length;

    let percentage = (score / questions.length) * 100;

    let message = "";

    if (percentage >= 80) {
        message = "Excellent! Your preparation is going very well. 🌟";
    } else if (percentage >= 60) {
        message = "Good Work! Keep practicing. 👍";
    } else if (percentage >= 40) {
        message = "Keep Learning! You can improve. 📚";
    } else {
        message = "Revise the topic and try again. 💪";
    }

    document.getElementById("resultMessage").textContent = message;

}


// ==================================
// RESTART
// ==================================

function restartPractice() {

    document.getElementById("resultSection")
        .classList.add("hidden");

    document.getElementById("subjectSection")
        .classList.remove("hidden");

}


// ==================================
// EXIT
// ==================================

function goHome() {

    document.getElementById("quizSection")
        .classList.add("hidden");

    document.getElementById("subjectSection")
        .classList.remove("hidden");

}


// ==================================
// SAFE EXPLANATION TEXT
// ==================================

function escapeHTML(value) {

    return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    })[character]);

}

</script>

</body>
</html>
